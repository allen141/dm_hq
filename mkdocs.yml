site_name: DM HQ
site_description: A workspace for building worlds, preparing sessions, and running encounters.
repo_name: dm_hq

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Use light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Operations:
      - Deployment: operations/deployment.md
  - Product:
      - Vision: product/vision.md
      - The Archive: product/archive.md
      - The Dashboard: product/dashboard.md
      - The Battlefield: product/battlefield.md
  - DM user guide:
      - Overview: guides/index.md
      - End-to-end workflows: guides/dm-user-workflows.md
  - Architecture:
      - Overview: architecture/index.md
      - Domain model: architecture/domain-model.md
      - Markdown documents: architecture/markdown-documents.md
      - Local agent workspace: architecture/agent-workspace.md
  - Planning:
      - Roadmap: planning/roadmap.md
      - Archive roadmap: planning/archive-roadmap.md
      - Archive implementation: planning/archive-implementation-plan.md
      - Archive exploration views: planning/archive-exploration-views.md
      - AI agent integration: planning/ai-agent-integration-plan.md
      - Open questions: planning/open-questions.md
  - Decisions:
      - Decision log: decisions/index.md
      - Container delivery: decisions/0003-single-node-container-delivery.md
      - Structured template fields (superseded): decisions/0004-structured-template-fields.md
      - Markdown campaign documents: decisions/0005-markdown-canonical-campaign-documents.md
      - Archive exploration views: decisions/0006-archive-exploration-view-model.md
      - WebGL map renderer and visual system: decisions/0007-webgl-map-renderer-and-visual-system.md
      - 2014 5e first: decisions/0001-2014-5e-first.md
      - Archive architecture: decisions/0002-archive-application-architecture.md
      - ADR template: decisions/0000-template.md
  - Contributing: contributing.md
