services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dm_hq
      POSTGRES_USER: dm_hq
      POSTGRES_PASSWORD: dev-only-change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dm_hq -d dm_hq"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dm_hq_postgres:/var/lib/postgresql

  api:
    build:
      context: ../apps/api
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-only-change-me
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      DB_HOST: db
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:${WEB_PORT:-3000},http://localhost:${WEB_PORT:-3000}
      DB_NAME: dm_hq
      DB_USER: dm_hq
      DB_PASSWORD: dev-only-change-me
      ALLOW_SEED_USER: "1"
      SEED_USERNAME: dm
      SEED_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py seed_dev_user && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4"]
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  dm_hq_postgres:
