[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dmhq-workspace"
version = "0.1.0"
description = "Local Markdown workspace client for DM HQ"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
keyring = ["keyring>=25,<26"]

[project.scripts]
dmhq = "dmhq.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
dmhq = ["templates/*"]
